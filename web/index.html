<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `user-scalable=no` is widely ignored on modern iOS, so it is not what
      stops a pinch or a double-tap zoom here; `touch-action` on the surfaces
      below is. It is kept because the browsers that do honour it are the ones
      where a stray zoom is hardest to undo mid-game.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>ascii-doom</title>

    <!--
      Installable. Every path here is relative so that it resolves against
      `/ascii-doom/` on Pages without the repository name being written down a
      second place — the one in the Vite config is already the thing that
      breaks when it is wrong.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#05050a" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <!-- iOS reads these rather than the manifest's display mode. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ascii-doom" />
    <style>
      :root {
        color-scheme: dark;
        /*
          The band of controls at the foot of a touch screen, as one number.

          Both the picture and the looking area are defined against it, because
          they have to agree: the grid stops above the band, and the half of the
          screen you drag to turn has to end where the grid does. They used to
          be written separately -- 190px here and 78% there -- and matched only
          because 654 of 844 happens to be 77.5%. Lying the phone down broke the
          coincidence and left the bottom 86px of the picture dead to the thumb.
        */
        --band: 190px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        /*
          The height you can see, not the height the page thinks it has.

          On iOS Safari a percentage here resolves against the layout viewport,
          which is the window with the toolbars out of the way. With the address
          bar showing -- which is most of the time, since it only retracts when
          something scrolls -- the page is taller than the visible part, and
          what falls off the bottom is the foot of the screen. That is where the
          controls are.

          Written second rather than instead: a browser that does not know the
          unit drops this line and keeps the one above it. And it cannot flicker
          the way a dynamic unit usually can, because the toolbar moves in
          response to scrolling and nothing on this page scrolls.
        */
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #05050a;
        color: #cfc8bc;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        /* A game is not a document: nothing here should scroll, select or
           magnify under a finger. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #screen {
        flex: 1;
        margin: 0;
        padding: 0;
        overflow: hidden;
        line-height: 1.05;
        font-size: 13px;
        white-space: pre;
        user-select: none;
        cursor: default;
      }
      #hint {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        /* Room on the right for the button that now floats over this row. */
        padding: 5px 120px 5px 10px;
        font-size: 12px;
        color: #6a6460;
        border-top: 1px solid #191922;
      }
      /*
        Its own fixed corner rather than the end of the legend. It read as part
        of the sentence there -- "E use open a WAD" -- and, worse, it went with
        the legend when the legend was hidden for touch, which left a phone no
        way to reach it.
      */
      #pick {
        position: fixed;
        right: max(10px, env(safe-area-inset-right));
        bottom: max(6px, env(safe-area-inset-bottom));
        z-index: 2;
        padding: 3px 9px;
        border: 1px solid #2c2c38;
        border-radius: 6px;
        background: rgba(20, 20, 28, 0.42);
        color: #b9b2a6;
        cursor: pointer;
        white-space: nowrap;
      }
      #pick:hover {
        background: rgba(60, 60, 78, 0.6);
      }
      /*
        The native control is the only bright thing on a near-black page and
        brings its own "No file chosen" besides, so the label is the button and
        this is hidden behind it. Clicking a label still opens the picker, and
        a check can still hand it a file: `setInputFiles` sets the files on the
        element rather than clicking it, so it does not need the input visible.
      */
      #wad {
        display: none;
      }

      /*
        The controls own a band at the foot of the screen rather than floating
        over the view. Overlaying was tried first, on the reasoning that
        vertical cells are the scarcest thing on a phone and a strip that
        pushed the picture up would cost more of the game than it gave back.
        It cost more than it looked: see the note on `#screen` below.
      */
      /*
        Sized the same way as the page, and for the same reason: a fixed element
        measures its percentages against that same too-tall layout viewport, so
        `inset: 0` put the foot of the controls behind the address bar even
        while the picture above them was the right size.
      */
      #pad {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        height: 100%;
        height: 100dvh;
        display: none;
        touch-action: none;
      }
      /* Shown for fingers, not for mice. A desktop keeps its keyboard. */
      @media (pointer: coarse) {
        #pad {
          display: block;
        }
        #hint {
          display: none;
        }
        /*
          The grid stops above the controls rather than running under them.
          Overlaying looked fine until the stick was sitting on the status line
          — and the bottom-left corner of that line is the health, which is the
          one number you cannot afford to have a thumb parked on.

          Margin rather than padding: the presenter measures this element's box
          to decide how many rows fit, and padding is inside that box, so the
          grid would keep its rows and simply draw them underneath. Measured on
          a 390x844 screen it costs twelve rows — 59 down to 47 — which is the
          price of a legible status line. The topmost control is the weapon
          button, not the stick, and it is what the 190px is sized against.
        */
        #screen {
          margin-bottom: var(--band);
        }
        /*
          Above the stick, on the left, where nothing else sits in either
          orientation -- the stick is 132 tall from the bottom inset, and the
          buttons are all on the right. Opening a file is a thing you do once,
          so it must not take a corner a thumb needs during a fight.
        */
        #pick {
          right: auto;
          left: max(16px, env(safe-area-inset-left));
          bottom: calc(max(18px, env(safe-area-inset-bottom)) + 140px);
        }
      }

      /*
        The right of the picture, all of it. `bottom` rather than a height, so
        this ends exactly where the grid does however tall the band is.
      */
      #look {
        position: absolute;
        right: 0;
        top: 0;
        bottom: var(--band);
        width: 55%;
        touch-action: none;
      }

      #stick {
        position: absolute;
        left: max(16px, env(safe-area-inset-left));
        bottom: max(18px, env(safe-area-inset-bottom));
        width: 132px;
        height: 132px;
        border: 1px solid #2c2c38;
        border-radius: 50%;
        background: rgba(20, 20, 28, 0.42);
        touch-action: none;
      }
      #knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        margin: -26px 0 0 -26px;
        border: 1px solid #454556;
        border-radius: 50%;
        background: rgba(78, 78, 96, 0.55);
        pointer-events: none;
      }

      .btn {
        position: absolute;
        border: 1px solid #2c2c38;
        border-radius: 12px;
        background: rgba(20, 20, 28, 0.42);
        color: #b9b2a6;
        font: inherit;
        font-size: 13px;
        display: grid;
        place-items: center;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      .btn:active {
        background: rgba(60, 60, 78, 0.6);
      }
      #fire {
        right: max(16px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        width: 98px;
        height: 98px;
        border-radius: 50%;
        font-size: 15px;
      }
      #use {
        right: calc(max(16px, env(safe-area-inset-right)) + 112px);
        bottom: max(18px, env(safe-area-inset-bottom));
        width: 72px;
        height: 60px;
      }
      #swap {
        right: max(16px, env(safe-area-inset-right));
        bottom: calc(max(18px, env(safe-area-inset-bottom)) + 110px);
        width: 98px;
        height: 52px;
      }
      /*
        Beside the weapon button rather than above it. A fourth row of controls
        would raise the top edge of the band, and the grid is sized to stop
        above that edge -- so a button placed the obvious way costs rows of
        picture, and this one costs none.
      */
      #map {
        right: calc(max(16px, env(safe-area-inset-right)) + 112px);
        bottom: calc(max(18px, env(safe-area-inset-bottom)) + 110px);
        width: 72px;
        height: 52px;
      }

      /*
        Landscape is where a band at the foot of the screen falls apart. The
        band is a fixed number of pixels and a phone on its side is only about
        390 of them tall, so it took three quarters of the picture: 14 rows at
        844x390 and 12 at 740x360, against 47 in portrait. A view thirteen rows
        tall is not a view.

        What landscape has instead is columns — 107 of them — so the controls
        take a strip of those and the grid keeps its full height. The buttons
        stack rather than sitting side by side, which is what makes the right
        strip one button wide instead of two.

        This block has to come last: it shares its specificity with the button
        rules above and wins on order, not on weight.
      */
      @media (pointer: coarse) and (orientation: landscape) {
        /* No band lying down: the controls take columns instead of rows. */
        :root {
          --band: 0px;
        }
        #screen {
          margin-left: 150px;
          margin-right: 122px;
        }
        #use {
          right: max(16px, env(safe-area-inset-right));
          bottom: calc(max(18px, env(safe-area-inset-bottom)) + 106px);
          width: 98px;
        }
        #swap {
          bottom: calc(max(18px, env(safe-area-inset-bottom)) + 174px);
        }
        /* Fourth on the stack; the strip is tall enough for it lying down. */
        #map {
          right: max(16px, env(safe-area-inset-right));
          bottom: calc(max(18px, env(safe-area-inset-bottom)) + 236px);
          width: 98px;
        }
      }
    </style>
  </head>
  <body>
    <pre id="screen"></pre>
    <!--
      The legend and the file picker share one row on purpose. A new row in this
      flex column would come out of `#screen`, which takes what is left and is
      measured to decide how many rows of game there are; sharing costs about
      one row on a desktop and none at all on a touch screen, where this whole
      element is hidden.

      The legend lives in its own span because the page writes it at boot, and
      writing it into `#hint` itself would take the input with it.
    -->
    <div id="hint">
      <span id="keys">booting…</span>
    </div>

    <!--
      Opening a file, and deliberately not inside the legend any more.

      The legend is hidden on a touch screen, and this was inside it, so on a
      phone there was no way to open a WAD at all -- the whole importer was
      unreachable on the one device most people would be holding.

      What puts it above the controls, which cover the whole screen, is the
      `z-index` in its rule and not where it sits here. That was worth finding
      out: this comment said the order was doing it, and moving it back in front
      of the controls changed nothing at all. The two together are belt and
      braces, and the check only fails when both are gone.
    -->
    <label id="pick">
      open a WAD
      <input id="wad" type="file" accept=".wad,application/octet-stream" />
    </label>

    <!--
      Touch controls. Left thumb walks, the right side of the screen turns and
      looks by dragging, and the buttons do the rest. Deliberately no run
      button: pushing the stick to its edge is the run, which is one gesture
      instead of two and leaves a thumb free.
    -->
    <div id="pad" aria-hidden="true">
      <div id="look"></div>
      <div id="stick"><div id="knob"></div></div>
      <button id="map" class="btn" type="button">map</button>
      <button id="swap" class="btn" type="button">weapon</button>
      <button id="use" class="btn" type="button">use</button>
      <button id="fire" class="btn" type="button">fire</button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
