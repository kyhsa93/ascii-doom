<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ascii-doom</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05050a;
        color: #cfc8bc;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #screen {
        flex: 1;
        margin: 0;
        padding: 0;
        overflow: hidden;
        line-height: 1.05;
        font-size: 13px;
        white-space: pre;
        user-select: none;
        cursor: default;
      }
      #hint {
        flex: none;
        padding: 5px 10px;
        font-size: 12px;
        color: #6a6460;
        border-top: 1px solid #191922;
      }
    </style>
  </head>
  <body>
    <pre id="screen"></pre>
    <div id="hint">booting…</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
