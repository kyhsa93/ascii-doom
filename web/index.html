<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `user-scalable=no` is widely ignored on modern iOS, so it is not what
      stops a pinch or a double-tap zoom here; `touch-action` on the surfaces
      below is. It is kept because the browsers that do honour it are the ones
      where a stray zoom is hardest to undo mid-game.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>ascii-doom</title>
    <meta
      name="description"
      content="글자로 그리는 1인칭 슈팅 게임. 1993년 슈팅 게임의 렌더링 기법을 문자 격자 위에 구현했고, Freedoom 아트와 맵으로 브라우저에서 키보드나 터치로 플레이합니다."
    />

    <!--
      Installable. Every path here is relative so that it resolves against
      `/ascii-doom/` on Pages without the repository name being written down a
      second place — the one in the Vite config is already the thing that
      breaks when it is wrong.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#05050a" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <!--
      The Freedoom maps and art ship in binary form, and its BSD licence asks
      that the notice travel with them. These two files are served beside the
      page; the noscript block links them for a reader.
    -->
    <link rel="license" href="COPYING.txt" />
    <!-- iOS reads these rather than the manifest's display mode. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ascii-doom" />
    <style>
      :root {
        color-scheme: dark;
        /*
          The band of controls at the foot of a touch screen, as one number.

          Both the picture and the looking area are defined against it, because
          they have to agree: the grid stops above the band, and the half of the
          screen you drag to turn has to end where the grid does. They used to
          be written separately -- 190px here and 78% there -- and matched only
          because 654 of 844 happens to be 77.5%. Lying the phone down broke the
          coincidence and left the bottom 86px of the picture dead to the thumb.
        */
        --band: 190px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        /*
          The height you can see, not the height the page thinks it has.

          On iOS Safari a percentage here resolves against the layout viewport,
          which is the window with the toolbars out of the way. With the address
          bar showing -- which is most of the time, since it only retracts when
          something scrolls -- the page is taller than the visible part, and
          what falls off the bottom is the foot of the screen. That is where the
          controls are.

          Written second rather than instead: a browser that does not know the
          unit drops this line and keeps the one above it. And it cannot flicker
          the way a dynamic unit usually can, because the toolbar moves in
          response to scrolling and nothing on this page scrolls.
        */
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #05050a;
        color: #cfc8bc;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        /* A game is not a document: nothing here should scroll, select or
           magnify under a finger. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #screen {
        flex: 1;
        margin: 0;
        padding: 0;
        overflow: hidden;
        line-height: 1.05;
        font-size: 13px;
        white-space: pre;
        user-select: none;
        cursor: default;
      }
      #hint {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 10px;
        font-size: 12px;
        color: #6a6460;
        border-top: 1px solid #191922;
      }
      /*
        Playing somebody else, which needs a string carried between two
        browsers by hand.

        There is no server behind this page and there is not going to be one,
        so the two halves of a WebRTC handshake have to travel the way a
        password does: one person copies a line, the other pastes it. That is
        clumsy and it is honest -- the alternative is a machine somewhere that
        somebody has to keep running.

        Hidden until asked for, because it is a wall of text on a page that is
        otherwise a game.
      */
      #meet {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 3;
        display: none;
        flex-direction: column;
        gap: 6px;
        width: min(520px, 92vw);
        padding: 12px;
        border: 1px solid #2c2c38;
        border-radius: 8px;
        background: rgba(10, 10, 16, 0.94);
      }
      #meet.up {
        display: flex;
      }
      #meet select {
        width: 100%;
        padding: 4px;
        border: 1px solid #2c2c38;
        border-radius: 6px;
        background: #05050a;
        color: #b9b2a6;
        font: inherit;
        font-size: 12px;
      }
      #meet textarea {
        width: 100%;
        height: 92px;
        resize: none;
        border: 1px solid #2c2c38;
        border-radius: 6px;
        background: #05050a;
        color: #b9b2a6;
        font: inherit;
        font-size: 11px;
      }
      #meet .row {
        display: flex;
        gap: 6px;
      }
      #meet button {
        flex: 1;
        padding: 5px 9px;
        border: 1px solid #2c2c38;
        border-radius: 6px;
        background: rgba(20, 20, 28, 0.42);
        color: #b9b2a6;
        font: inherit;
        cursor: pointer;
      }
      #meet button:hover {
        background: rgba(60, 60, 78, 0.6);
      }
      #meetsaid {
        color: #6a6460;
        font-size: 11px;
        min-height: 14px;
      }
      /*
        Hidden, and clicked by a line on the title rather than by anything here.
        The native control is the only bright thing on a near-black page and
        brings its own "No file chosen" besides. A check can still hand it a
        file: `setInputFiles` sets the files on the element rather than clicking
        it, so it does not need the input visible.
      */
      #wad {
        display: none;
      }

      /*
        The controls own a band at the foot of the screen rather than floating
        over the view. Overlaying was tried first, on the reasoning that
        vertical cells are the scarcest thing on a phone and a strip that
        pushed the picture up would cost more of the game than it gave back.
        It cost more than it looked: see the note on `#screen` below.
      */
      /*
        Sized the same way as the page, and for the same reason: a fixed element
        measures its percentages against that same too-tall layout viewport, so
        `inset: 0` put the foot of the controls behind the address bar even
        while the picture above them was the right size.
      */
      #pad {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        height: 100%;
        height: 100dvh;
        display: none;
        touch-action: none;
      }
      /* Shown for fingers, not for mice. A desktop keeps its keyboard. */
      @media (pointer: coarse) {
        #pad {
          display: block;
        }
        #hint {
          display: none;
        }
        /*
          The grid stops above the controls rather than running under them.
          Overlaying looked fine until the stick was sitting on the status line
          — and the bottom-left corner of that line is the health, which is the
          one number you cannot afford to have a thumb parked on.

          Margin rather than padding: the presenter measures this element's box
          to decide how many rows fit, and padding is inside that box, so the
          grid would keep its rows and simply draw them underneath. Measured on
          a 390x844 screen it costs twelve rows — 59 down to 47 — which is the
          price of a legible status line. The topmost control is the weapon
          button, not the stick, and it is what the 190px is sized against.
        */
        #screen {
          margin-bottom: var(--band);
          /*
            Smaller than at a desk, and for the opposite of the obvious reason.
            A phone's grid was 49 by 47, which is not enough cells to say what a
            creature is -- it came out as a dozen characters of red. At eight
            pixels it is 80 by 77, the creature has a shape, and the text is
            still crisp because a handset draws three device pixels for each of
            these and the earlier judgement against small text was read off a
            screenshot at one.
            Eight rather than six and a half: at six and a half the walls thin
            out into a faint stipple and the room stops reading, which no amount
            of extra detail on the creature makes up for. And eighty columns is
            over the seventy-two the status bar needs, so a phone gets the bar
            rather than the single line.
          */
          font-size: 8px;
        }
      }

      /*
        The right of the picture, all of it. `bottom` rather than a height, so
        this ends exactly where the grid does however tall the band is.
      */
      #look {
        position: absolute;
        right: 0;
        top: 0;
        bottom: var(--band);
        width: 55%;
        touch-action: none;
      }

      #stick {
        position: absolute;
        left: max(16px, env(safe-area-inset-left));
        bottom: max(18px, env(safe-area-inset-bottom));
        width: 132px;
        height: 132px;
        border: 1px solid #2c2c38;
        border-radius: 50%;
        background: rgba(20, 20, 28, 0.42);
        touch-action: none;
      }
      #knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        margin: -26px 0 0 -26px;
        border: 1px solid #454556;
        border-radius: 50%;
        background: rgba(78, 78, 96, 0.55);
        pointer-events: none;
      }

      .btn {
        position: absolute;
        border: 1px solid #2c2c38;
        border-radius: 12px;
        background: rgba(20, 20, 28, 0.42);
        color: #b9b2a6;
        font: inherit;
        font-size: 13px;
        display: grid;
        place-items: center;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      .btn:active {
        background: rgba(60, 60, 78, 0.6);
      }
      #fire {
        right: max(16px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        width: 98px;
        height: 98px;
        border-radius: 50%;
        font-size: 15px;
      }
      #use {
        right: calc(max(16px, env(safe-area-inset-right)) + 112px);
        bottom: max(18px, env(safe-area-inset-bottom));
        width: 72px;
        height: 60px;
      }
      #swap {
        right: max(16px, env(safe-area-inset-right));
        bottom: calc(max(18px, env(safe-area-inset-bottom)) + 110px);
        width: 98px;
        height: 52px;
      }
      /*
        Beside the weapon button rather than above it. A fourth row of controls
        would raise the top edge of the band, and the grid is sized to stop
        above that edge -- so a button placed the obvious way costs rows of
        picture, and this one costs none.
      */
      #map {
        right: calc(max(16px, env(safe-area-inset-right)) + 112px);
        bottom: calc(max(18px, env(safe-area-inset-bottom)) + 110px);
        width: 72px;
        height: 52px;
      }

      /*
        Landscape is where a band at the foot of the screen falls apart. The
        band is a fixed number of pixels and a phone on its side is only about
        390 of them tall, so it took three quarters of the picture: 14 rows at
        844x390 and 12 at 740x360, against 47 in portrait. A view thirteen rows
        tall is not a view.

        What landscape has instead is columns — 107 of them — so the controls
        take a strip of those and the grid keeps its full height. The buttons
        stack rather than sitting side by side, which is what makes the right
        strip one button wide instead of two.

        This block has to come last: it shares its specificity with the button
        rules above and wins on order, not on weight.
      */
      @media (pointer: coarse) and (orientation: landscape) {
        /* No band lying down: the controls take columns instead of rows. */
        :root {
          --band: 0px;
        }
        #screen {
          margin-left: 150px;
          margin-right: 122px;
        }
        #use {
          right: max(16px, env(safe-area-inset-right));
          bottom: calc(max(18px, env(safe-area-inset-bottom)) + 106px);
          width: 98px;
        }
        #swap {
          bottom: calc(max(18px, env(safe-area-inset-bottom)) + 174px);
        }
        /* Fourth on the stack; the strip is tall enough for it lying down. */
        #map {
          right: max(16px, env(safe-area-inset-right));
          bottom: calc(max(18px, env(safe-area-inset-bottom)) + 236px);
          width: 98px;
        }
      }
    </style>
  </head>
  <body>
    <pre id="screen"></pre>
    <!--
      The legend, which is one row and no more. A new row in this flex column
      would come out of `#screen`, which takes what is left and is measured to
      decide how many rows of game there are. It is hidden altogether on a touch
      screen, where the controls say the same thing by being shaped like it.

      The legend lives in its own span because the page writes it at boot.
    -->
    <div id="hint">
      <span id="keys">booting…</span>
    </div>

    <!--
      Opening a file, with nothing on the screen to say so.

      This was a button floating in a corner of the picture, and it spent a
      while being moved around it: out of the legend because the legend is
      hidden for touch, then into a corner no thumb needs during a fight. The
      answer was that a game does not put a file picker on top of itself. It is
      a line on the title now, where choosing a level already lives, and what is
      left here is the input the line clicks -- hidden, because the native
      control is the only bright thing on a near-black page and brings its own
      "No file chosen" besides.
    -->
    <input id="wad" type="file" accept=".wad,application/octet-stream" />

    <!--
      The two halves of a handshake, carried by a person.

      `host` makes the first string; the other player pastes it, presses
      `join`, and sends back what appears; the first player pastes that and
      presses `accept`. Three copies between two people and no server at all.
    -->
    <div id="meet">
      <div id="meetsaid">two players, over one string each way</div>
      <!--
        Which map the two of you meet on. A dropdown because there are
        sixty-eight of them and picking one of sixty-eight is what a dropdown
        is for; the host's choice is what both sides fetch.
      -->
      <select id="meetmap"></select>
      <textarea id="meetmine" readonly placeholder="yours appears here"></textarea>
      <textarea id="meettheirs" placeholder="paste theirs here"></textarea>
      <div class="row">
        <button id="meethost" type="button">host</button>
        <button id="meetjoin" type="button">join</button>
        <button id="meetaccept" type="button">accept</button>
        <button id="meetshut" type="button">close</button>
      </div>
    </div>

    <!--
      Touch controls. Left thumb walks, the right side of the screen turns and
      looks by dragging, and the buttons do the rest. Deliberately no run
      button: pushing the stick to its edge is the run, which is one gesture
      instead of two and leaves a thumb free.
    -->
    <div id="pad" aria-hidden="true">
      <div id="look"></div>
      <div id="stick"><div id="knob"></div></div>
      <button id="map" class="btn" type="button">map</button>
      <button id="swap" class="btn" type="button">weapon</button>
      <button id="use" class="btn" type="button">use</button>
      <button id="fire" class="btn" type="button">fire</button>
    </div>

    <script type="module" src="./main.ts"></script>
    <!--
      What a crawler, or a browser with scripts off, reads instead of the game.
      The page is otherwise a <pre> that main.ts fills, so without this there
      is next to no text on it. Hidden whenever scripts run, so it costs the
      game nothing.
    -->
    <noscript>
      <article lang="ko">
        <h1>ascii-doom — 글자로 그리는 1인칭 슈팅</h1>
        <p>1993년 1인칭 슈팅 게임의 렌더링 기법과 게임 규칙을 브라우저의 문자 격자 위에 구현한 게임입니다. 벽, 바닥, 괴물, 무기, 아이템이 모두 글자와 색으로 그려집니다. 그림은 3조항 BSD 라이선스로 공개된 Freedoom의 아트를 미리 글자로 변환한 것이고, 상용 게임의 데이터 파일은 필요하지도 않고 쓰지도 않습니다.</p>
        <h2>무엇을 하는 게임인가</h2>
        <p>열쇠를 찾아 잠긴 문을 열고, 리프트와 순간이동 장치를 타고, 괴물을 쓰러뜨리며 출구까지 가는 게임입니다. 이 프로젝트를 위해 만든 레벨 두 개(전초기지 the outpost, 저수조 the cistern)와 함께 Freedoom의 맵 68개가 실려 있습니다. 자동 지도에는 실제로 본 곳만 그려지고, 체력이 다하면 그 레벨을 시작할 때의 장비로 다시 시작합니다. 진행 상황은 브라우저 저장소에 자동으로 저장되어 타이틀 화면에서 이어 할 수 있습니다.</p>
        <p>가지고 있는 WAD 파일을 열어 그 파일의 맵을 그 파일의 그림으로 플레이할 수도 있습니다. 파일은 기기 밖으로 나가지 않습니다. 서버 없이 접속 문자열을 서로 복사해 붙여 넣는 방식으로 두 사람이 함께 플레이하는 모드와, 플레이를 녹화하고 다시 보는 기능도 있습니다.</p>
        <h2>조작법</h2>
        <ul>
          <li>W A S D: 이동과 옆걸음, Shift: 달리기</li>
          <li>← →: 방향 전환, ↑ ↓: 위아래 보기</li>
          <li>Space: 발사, 1~7: 무기 칸 선택</li>
          <li>E: 앞에 있는 문이나 스위치 사용, Tab: 자동 지도, Esc: 타이틀로</li>
        </ul>
        <p>터치 화면에서는 왼쪽 스틱으로 걷고(끝까지 밀면 달리기), 화면 오른쪽 절반을 끌어 시점을 돌리며, 발사·사용·무기·지도 버튼을 씁니다. 터치에서는 보이는 가장 가까운 괴물에게 자동으로 조준됩니다.</p>
        <h2>필요한 것</h2>
        <p>자바스크립트가 켜진 최신 브라우저 하나면 됩니다. 컴퓨터에서는 키보드, 휴대폰과 태블릿에서는 터치로 플레이하며, 설치 없이 바로 실행되고 브라우저 메뉴에서 홈 화면에 앱처럼 설치할 수도 있습니다. 오프라인 플레이는 지원하지 않습니다.</p>
        <h2>라이선스</h2>
        <p>맵과 그림은 Freedoom의 것이며 3조항 BSD 라이선스를 따릅니다. 라이선스 전문은 <a href="COPYING.txt">COPYING.txt</a>, 기여자 목록은 <a href="CREDITS.txt">CREDITS.txt</a>에 있습니다.</p>
      </article>
      <article lang="en">
        <h2>In English</h2>
        <p>ascii-doom is a first-person shooter drawn entirely with characters, built on ascii-engine. It plays two levels written for this project and the sixty-eight maps of Freedoom in the browser, with a keyboard (WASD to move, arrows to turn, Space to fire, E to use, Tab for the automap) or with touch controls on a phone. You can also open a WAD file of your own, play with a second person over a copied connection string, and record and replay a run. JavaScript is required to play.</p>
        <p>The maps and art are Freedoom's, under its three-clause BSD licence: see <a href="COPYING.txt">COPYING.txt</a> and the contributors in <a href="CREDITS.txt">CREDITS.txt</a>.</p>
      </article>
    </noscript>
  </body>
</html>
